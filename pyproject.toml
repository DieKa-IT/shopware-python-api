[project]
name = "shopware-admin-python"
version = "0.1.0a1"
description = "Typed Shopware Admin API entities, expressions, and explicit writes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha"]
authors = [
    { name = "Henrik D.", email = "henrik.brokkoli@mailbox.org" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
]

[project.urls]
Repository = "https://github.com/DieKa-IT/shopware-python-api"
Issues = "https://github.com/DieKa-IT/shopware-python-api/issues"
Documentation = "https://github.com/DieKa-IT/shopware-python-api/blob/main/README.md"

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1.18,<2", "pyright>=1.1.400,<2", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/shopware_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/shopware_admin", "tests/typing_contract.py"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["tests/typing_contract.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP046", "UP047", "E712"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
